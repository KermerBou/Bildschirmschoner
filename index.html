<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feuerwehr Stamsried - Uhrzeit Widget</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background-color: #000000; /* Hintergrund schwarz */
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }

    .widget-container {
      display: flex;
      align-items: center;
      gap: 20px;
      padding: 15px 25px;
      background-color: #000000; /* Schwarzer Hintergrund */
      border-radius: 12px;
    }

    .logo-container img {
      height: 100px;
      width: auto;
      display: block;
    }

    .clock-container {
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    /* Schriftfarbe auf WEISS gestellt */
    .time {
      font-size: 2.5rem;
      font-weight: bold;
      color: #ffffff; /* Weiß */
      line-height: 1;
      font-family: 'Courier New', Courier, monospace;
    }

    .date {
      font-size: 1rem;
      margin-top: 5px;
      color: #ffffff; /* Weiß */
    }
  </style>
</head>
<body>

  <div class="widget-container">
    <div class="logo-container">
      <img src="wappen.png" alt="Wappen Freiwillige Feuerwehr Markt Stamsried">
    </div>

    <div class="clock-container">
      <div id="clock" class="time">00:00:00</div>
      <div id="date" class="date">Montag, 1. Januar 2026</div>
    </div>
  </div>

  <script>
    function updateClock() {
      const now = new Date();

      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const seconds = String(now.getSeconds()).padStart(2, '0');
      document.getElementById('clock').textContent = `${hours}:${minutes}:${seconds}`;

      const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
      document.getElementById('date').textContent = now.toLocaleDateString('de-DE', options);
    }

    updateClock();
    setInterval(updateClock, 1000);
  </script>

</body>
</html>s
